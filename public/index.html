<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure File Transfer</title><link rel="stylesheet" href="/styles.css"><main><h1>Secure File Transfer</h1><p>Encryption happens in your browser. The server stores ciphertext only.</p><section><h2>Upload</h2><input id="file" type="file"><input id="upPass" type="password" placeholder="Password"><button id="upload">Encrypt and upload</button><progress id="progress" max="100" value="0"></progress><output id="upOut"></output></section><section><h2>Download</h2><input id="id" placeholder="File ID"><input id="downPass" type="password" placeholder="Password"><button id="download">Download and decrypt</button><output id="downOut"></output></section></main><script type="module" src="/app.js"></script>
